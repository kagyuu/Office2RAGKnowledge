[project]
name = "office2ragknowledge"
version = "1.0.0"
description = "Office文書 (Word/Excel/PowerPoint) をAIのRAGパイプライン向けMarkdownに変換するツール"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HONDOH Atsushi" }]
keywords = ["office", "markdown", "rag", "docx", "xlsx", "pptx"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "lxml>=5.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]

[project.scripts]
office2rag = "office2ragknowledge.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/office2ragknowledge"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Typer は引数既定値に関数呼び出しを使う設計のため

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# これらのライブラリは型スタブを同梱していないため、import の解決を緩める。
# 本アプリ自身のコードは strict のまま検査される (P003 §12C)。
module = ["docx.*", "pptx.*", "openpyxl.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: 性能テスト (既定では実行しない)"]
addopts = "-m 'not perf'"
